name: CI

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact commit SHA to validate
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One useful CI run per PR/main update; superseded runs are cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.target_sha || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install · Lint · Typecheck · Test · Migrate · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Migration check
        run: npm run migrate:check

      - name: Build
        run: npm run build
